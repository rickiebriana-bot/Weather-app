<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Reality Pro</title>

<style>
:root {
    --bg-base: #09101d;
    --bg-panel: #111a2c;
    --bg-panel-hover: #162138;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-dark: #64748b;
    --accent: #38bdf8;
    --bar-bg: #1e293b;
    
    --green: #22c55e;
    --green-light: #4ade80;
    --green-bg: rgba(34, 197, 94, 0.15);
    
    --yellow: #eab308;
    --yellow-light: #fde047;
    --yellow-bg: rgba(234, 179, 8, 0.15);
    
    --orange: #f97316;
    --orange-light: #fdba74;
    --orange-bg: rgba(249, 115, 22, 0.15);
    
    --red: #ef4444;
    --red-light: #fca5a5;
    --red-bg: rgba(239, 68, 68, 0.15);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
}

/* Search Area */
.search-container {
    max-width: 800px;
    margin: 0 auto 30px auto;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

input {
    flex-grow: 1;
    min-width: 200px;
    background: var(--bg-panel);
    border: 1px solid var(--bar-bg);
    padding: 14px 18px;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus { border-color: var(--accent); }

button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
}

button:hover { background: #7dd3fc; }

.fav-btn {
    background: var(--bg-panel);
    color: var(--text-muted);
    border: 1px solid var(--bar-bg);
}

.fav-btn:hover { background: var(--bg-panel-hover); color: white; }

/* Main App Wrapper */
#app-wrapper {
    max-width: 800px;
    margin: 0 auto;
    display: none;
}

/* Top Dashboard */
.current-dash {
    background: transparent;
    padding: 10px 0 30px 0;
}

.loc-name {
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 5px;
    font-weight: 600;
}

.flex-between {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.temp-huge {
    font-size: 96px;
    font-weight: 200;
    line-height: 1;
    margin: 0;
}

.desc-text {
    font-size: 18px;
    color: var(--text-muted);
    margin-top: 10px;
}

.gauge-box {
    text-align: right;
    padding-bottom: 10px;
}
.gauge-label {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dark);
    text-transform: uppercase;
    margin-bottom: 2px;
    font-weight: 600;
}
.gauge-val {
    font-size: 26px;
    font-weight: 600;
}
.gauge-date {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
}

.metrics-row {
    display: flex;
    gap: 20px;
    margin-top: 25px;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
    flex-wrap: wrap;
}

/* 10-Day Forecast List */
.forecast-section {
    margin-top: 20px;
}
.section-title {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: var(--text-dark);
    font-weight: 600;
    margin-bottom: 15px;
}

.f-item {
    margin-bottom: 8px;
}

.f-row {
    display: grid;
    grid-template-columns: 80px 40px 1fr 40px 120px 40px 50px 90px;
    align-items: center;
    background: var(--bg-panel);
    padding: 16px 20px;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
    user-select: none;
}

.f-row:hover {
    background: var(--bg-panel-hover);
    transform: scale(1.005);
}

.f-date { font-size: 15px; font-weight: 500; }
.f-date span { display: block; font-size: 12px; color: var(--text-dark); margin-top: 2px; }

.f-icon { font-size: 20px; text-align: center; }
.f-desc { font-size: 14px; color: var(--text-muted); padding-left: 10px; }
.f-temp { font-size: 15px; font-weight: 500; text-align: center; }
.f-temp.muted { color: var(--text-muted); }

/* Dynamic Temp Bar */
.bar-wrapper {
    height: 4px;
    background: var(--bar-bg);
    border-radius: 2px;
    margin: 0 10px;
    position: relative;
    overflow: hidden;
}
.bar-fill {
    position: absolute;
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #3b82f6, #f97316);
}

.f-precip { font-size: 13px; color: var(--accent); text-align: right; padding-right: 15px; }

/* Score Pills */
.score-pill {
    padding: 6px 0;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    border: 1px solid transparent;
}
.pill-green { border-color: var(--green); color: var(--green-light); background: var(--green-bg); }
.pill-yellow { border-color: var(--yellow); color: var(--yellow-light); background: var(--yellow-bg); }
.pill-orange { border-color: var(--orange); color: var(--orange-light); background: var(--orange-bg); }
.pill-red { border-color: var(--red); color: var(--red-light); background: var(--red-bg); }

/* Expandable Reason Card */
.reason-card {
    display: none;
    background: #0d1524;
    border: 1px solid var(--bar-bg);
    border-top: none;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    padding: 16px 20px;
    margin-top: -6px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
}

.reason-card strong {
    color: var(--text-main);
}

.reason-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-dark);
}

@media (max-width: 650px) {
    .f-row { grid-template-columns: 70px 30px 1fr 80px; }
    .f-temp, .bar-wrapper, .f-precip { display: none; }
    .temp-huge { font-size: 72px; }
}
</style>
</head>

<body>

<div class="search-container">
    <input id="location" placeholder="Search city (e.g. San Francisco, CA)">
    <button onclick="run()">Search</button>
    <button class="fav-btn" onclick="searchFavorite('Revere, MA')">📍 Revere, MA</button>
</div>

<div id="results" style="text-align:center; color: #64748b; margin-top: 40px;">Enter a location to view the Configuration-Driven Forecast.</div>

<div id="app-wrapper">
    <div class="current-dash">
        <div class="loc-name" id="ui-loc">--</div>
        
        <div class="flex-between">
            <h1 class="temp-huge" id="ui-temp">--°</h1>
            
            <div class="gauge-box">
                <div class="gauge-label">Outdoor Score</div>
                <div class="gauge-val" id="ui-top-score">--</div>
                <div class="gauge-date" id="ui-top-date">--</div>
            </div>
        </div>
        
        <div class="desc-text" id="ui-desc">--</div>
        
        <div class="metrics-row">
            <span id="ui-wind">💨 --</span>
            <span id="ui-hum">💧 --</span>
            <span id="ui-rain">☔ --</span>
            <span id="ui-uv">☀️ --</span>
            <span id="ui-hilo">⬆ -- / ⬇ --</span>
        </div>
    </div>
    
    <div class="forecast-section">
        <div class="section-title">10-DAY FORECAST (CLICK FOR CONFIG SCORES)</div>
        <div id="forecast-list"></div>
    </div>
</div>

<script>
document.getElementById("location").addEventListener("keypress", function(event) {
    if (event.key === "Enter") run();
});

function searchFavorite(loc) {
    document.getElementById("location").value = loc;
    run();
}

function toggleReason(idx) {
    const el = document.getElementById(`reason-${idx}`);
    el.style.display = el.style.display === "block" ? "none" : "block";
}

const wmoMap = {
    0: { txt: "Sunny", icon: "☀️" }, 1: { txt: "Mainly Sunny", icon: "🌤" },
    2: { txt: "Partly Cloudy", icon: "⛅" }, 3: { txt: "Cloudy", icon: "☁️" },
    45: { txt: "Foggy", icon: "🌫" }, 48: { txt: "Rime Fog", icon: "🌫" },
    51: { txt: "Light Drizzle", icon: "🌧" }, 53: { txt: "Drizzle", icon: "🌧" },
    55: { txt: "Heavy Drizzle", icon: "🌧" }, 61: { txt: "Light Rain", icon: "🌦" },
    63: { txt: "Rain", icon: "🌧" }, 65: { txt: "Heavy Rain", icon: "🌧" },
    71: { txt: "Light Snow", icon: "🌨" }, 73: { txt: "Snow", icon: "❄️" },
    75: { txt: "Heavy Snow", icon: "❄️" }, 95: { txt: "Thunderstorms", icon: "⛈" }
};
function getWeatherMeta(code) { return wmoMap[code] || { txt: "Mixed", icon: "🌥" }; }


// =========================================================================
// 1. DATA-DRIVEN CONFIGURATIONS (JSON Serializable)
// =========================================================================
// This is the "personality" of the engine. It dictates WHAT is ideal.
const SCORING_PROFILES = {
    "default": {
        "thermal": {
            "label": "Thermal",
            "weight": 0.40,
            "curve": "bell",
            "ideal": 72,
            "tolerance": 18
        },
        "dewPoint": {
            "label": "Dew Point",
            "weight": 0.15,
            "curve": "oneSidedUpper",
            "ideal": 55,
            "maxAllowed": 70
        },
        "rain": {
            "label": "Rain",
            "weight": 0.20,
            "curve": "exponential",
            "ideal": 0,
            "decayFactor": 15 
        },
        "wind": {
            "label": "Wind",
            "weight": 0.10,
            "curve": "oneSidedUpper",
            "ideal": 5,
            "maxAllowed": 25
        },
        "clouds": {
            "label": "Clouds",
            "weight": 0.10,
            "curve": "linear",
            "ideal": 20,
            "tolerance": 80
        },
        "uv": {
            "label": "UV Index",
            "weight": 0.05,
            "curve": "oneSidedUpper",
            "ideal": 4,
            "maxAllowed": 11
        }
    }
    // Future expansion is trivial:
    // "beach": { ... },
    // "winter": { ... }
};


// =========================================================================
// 2. CURVE REGISTRY (Pure Mathematical Engines)
// =========================================================================
// These functions are ignorant to weather. They just process (value, config)
const CurveRegistry = {
    bell: (val, config) => {
        const dist = Math.abs(val - config.ideal);
        // Standard normal distribution curve mapped to 0-100
        const score = 100 * Math.exp(-(dist * dist) / (2 * config.tolerance * config.tolerance));
        return Math.max(0, Math.min(100, score));
    },
    linear: (val, config) => {
        const dist = Math.abs(val - config.ideal);
        const score = 100 - ((dist / config.tolerance) * 100);
        return Math.max(0, Math.min(100, score));
    },
    oneSidedUpper: (val, config) => {
        if (val <= config.ideal) return 100;
        if (val >= config.maxAllowed) return 0;
        const dist = val - config.ideal;
        const score = 100 - ((dist / (config.maxAllowed - config.ideal)) * 100);
        return Math.max(0, Math.min(100, score));
    },
    exponential: (val, config) => {
        if (val <= config.ideal) return 100;
        const dist = val - config.ideal;
        // Exponential decay
        const score = 100 * Math.exp(-dist / config.decayFactor);
        return Math.max(0, Math.min(100, score));
    }
};


// =========================================================================
// 3. OVERALL COORDINATOR ENGINE
// =========================================================================
// Totally decoupled from weather concepts. Just processes the config payload.
function computeGenericScore(hourMetrics, profileConfig) {
    let totalScore = 0;
    const breakdown = {};

    for (const [categoryKey, config] of Object.entries(profileConfig)) {
        const val = hourMetrics[categoryKey];
        
        // Execute the assigned mathematical curve
        const curveEngine = CurveRegistry[config.curve];
        const normalizedScore = curveEngine(val, config);
        
        breakdown[categoryKey] = {
            label: config.label,
            score: Math.round(normalizedScore),
            val: val
        };

        // Apply config weight
        totalScore += normalizedScore * config.weight;
    }

    return {
        finalScore: Math.max(0, Math.min(100, totalScore)),
        breakdown: breakdown
    };
}


// ==========================================
// MASTER WEATHER DATA REPOSITORY 
// ==========================================
async function fetchMasterWeatherData(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,cloud_cover,wind_speed_10m` +
        `&hourly=temperature_2m,apparent_temperature,dew_point_2m,relative_humidity_2m,precipitation_probability,precipitation,weather_code,cloud_cover,wind_speed_10m,uv_index` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max` +
        `&forecast_days=10&timezone=auto&temperature_unit=fahrenheit&wind_speed_unit=mph`;

    const res = await fetch(url);
    const data = await res.json();
    const structuredDays = {};

    data.hourly.time.forEach((t, i) => {
        const dateStr = t.split("T")[0];
        const hour = parseInt(t.split("T")[1].slice(0, 2));

        if (!structuredDays[dateStr]) structuredDays[dateStr] = [];

        // Push data matching the exact keys found in SCORING_PROFILES
        structuredDays[dateStr].push({
            time: t,
            hour: hour,
            thermal: data.hourly.apparent_temperature[i],
            dewPoint: data.hourly.dew_point_2m[i],
            rain: data.hourly.precipitation_probability[i] || 0,
            wind: data.hourly.wind_speed_10m[i] || 0,
            clouds: data.hourly.cloud_cover[i] || 0,
            uv: data.hourly.uv_index[i] || 0
        });
    });

    return { raw: data, structuredDays };
}

function getScoreStyling(score) {
    if(score >= 80) return { label: "Excellent", cls: "pill-green", color: "var(--green-light)" };
    if(score >= 60) return { label: "Good", cls: "pill-yellow", color: "var(--yellow-light)" };
    if(score >= 40) return { label: "Fair", cls: "pill-orange", color: "var(--orange-light)" };
    return { label: "Poor", cls: "pill-red", color: "var(--red-light)" };
}

async function run() {
    const loc = document.getElementById("location").value.trim();
    if(!loc) return;

    document.getElementById("results").style.display = "block";
    document.getElementById("results").innerText = "Executing Coordinator Engine...";
    document.getElementById("app-wrapper").style.display = "none";

    try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(loc)}&count=1`);
        const geoData = await geoRes.json();
        if(!geoData.results) {
            document.getElementById("results").innerText = "Location not found.";
            return;
        }
        
        const { latitude, longitude, name, admin1 } = geoData.results[0];

        const master = await fetchMasterWeatherData(latitude, longitude);
        const cur = master.raw.current;
        const curMeta = getWeatherMeta(cur.weather_code);

        // Top Dashboard UI
        document.getElementById("ui-loc").innerText = `${name}, ${admin1 || ""}`;
        document.getElementById("ui-temp").innerText = `${Math.round(cur.temperature_2m)}°`;
        document.getElementById("ui-desc").innerText = `${curMeta.txt} · Feels like ${Math.round(cur.apparent_temperature)}°`;
        document.getElementById("ui-wind").innerText = `💨 ${Math.round(cur.wind_speed_10m)} mph`;
        document.getElementById("ui-hum").innerText = `💧 ${Math.round(cur.relative_humidity_2m)}% humidity`;
        document.getElementById("ui-rain").innerText = `☔ ${cur.precipitation > 0 ? '>0' : '0'}% precip`;
        document.getElementById("ui-uv").innerText = `☀️ UV ${Math.round(master.raw.daily.uv_index_max[0] || 0)}`;
        document.getElementById("ui-hilo").innerText = `⬆ ${Math.round(master.raw.daily.temperature_2m_max[0])}° / ⬇ ${Math.round(master.raw.daily.temperature_2m_min[0])}°`;

        const absMin = Math.min(...master.raw.daily.temperature_2m_min);
        const absMax = Math.max(...master.raw.daily.temperature_2m_max);

        let listHTML = "";
        let todayScoreObj = null;

        // Select which JSON config to use
        const activeConfig = SCORING_PROFILES["default"];
        const dayKeys = Object.keys(master.structuredDays).slice(0, 10);
        
        dayKeys.forEach((dateStr, idx) => {
            const entries = master.structuredDays[dateStr];
            const daytime = entries.filter(e => e.hour >= 7 && e.hour <= 19);

            let dailyBestScore = -1;
            let bestBreakdown = null;

            // Rolling 4-hour window
            for(let i = 0; i <= daytime.length - 4; i++) {
                const windowHours = daytime.slice(i, i + 4);
                let windowTotal = 0;
                let lastBreakdown = null;

                windowHours.forEach(h => {
                    // Injecting the agnostic JSON config into the engine
                    const result = computeGenericScore(h, activeConfig);
                    windowTotal += result.finalScore;
                    lastBreakdown = result.breakdown;
                });
                
                const avgScore = windowTotal / 4;
                if(avgScore > dailyBestScore) {
                    dailyBestScore = avgScore;
                    bestBreakdown = lastBreakdown;
                }
            }
            if(dailyBestScore < 0) dailyBestScore = 0;

            const dayMin = master.raw.daily.temperature_2m_min[idx];
            const dayMax = master.raw.daily.temperature_2m_max[idx];
            const maxPrecip = master.raw.daily.precipitation_probability_max[idx];
            const meta = getWeatherMeta(master.raw.daily.weather_code[idx]);
            const scoreStyle = getScoreStyling(dailyBestScore);
            
            const leftPct = ((dayMin - absMin) / (absMax - absMin)) * 100;
            const widthPct = ((dayMax - dayMin) / (absMax - absMin)) * 100;

            const dObj = new Date(dateStr + "T12:00:00");
            const dayName = idx === 0 ? "Today" : dObj.toLocaleDateString("en-US", { weekday: "short" });
            const monthDay = dObj.toLocaleDateString("en-US", { month: "short", day: "numeric" });

            if(idx === 0) todayScoreObj = { score: Math.round(dailyBestScore), style: scoreStyle, dateTxt: monthDay };

            // Render dynamic pill stats generated strictly by the JSON output
            let breakdownHTML = "";
            if (bestBreakdown) {
                Object.values(bestBreakdown).forEach(item => {
                    const color = item.score >= 80 ? "var(--green-light)" : item.score >= 50 ? "var(--yellow-light)" : "var(--red-light)";
                    breakdownHTML += `<span>${item.label}: <strong style="color:${color}">${item.score}/100</strong></span>`;
                });
            }

            listHTML += `
            <div class="f-item">
                <div class="f-row" onclick="toggleReason(${idx})">
                    <div class="f-date"><b>${dayName}</b><span>${monthDay}</span></div>
                    <div class="f-icon">${meta.icon}</div>
                    <div class="f-desc">${meta.txt}</div>
                    <div class="f-temp muted">${Math.round(dayMin)}°</div>
                    <div class="bar-wrapper">
                        <div class="bar-fill" style="margin-left: ${leftPct}%; width: ${widthPct}%;"></div>
                    </div>
                    <div class="f-temp">${Math.round(dayMax)}°</div>
                    <div class="f-precip">${maxPrecip > 0 ? maxPrecip + '%' : '-'}</div>
                    <div class="score-pill ${scoreStyle.cls}">outdoor ${Math.round(dailyBestScore)}</div>
                </div>
                <div class="reason-card" id="reason-${idx}">
                    <strong style="margin-bottom:8px; display:block;">Target-Based Data Breakdown (Peak Window):</strong>
                    <div class="reason-metrics">
                        ${breakdownHTML}
                    </div>
                </div>
            </div>
            `;
        });

        document.getElementById("forecast-list").innerHTML = listHTML;
        
        document.getElementById("ui-top-score").innerText = todayScoreObj.score;
        document.getElementById("ui-top-score").style.color = todayScoreObj.style.color;
        document.getElementById("ui-top-score").nextElementSibling.innerText = todayScoreObj.style.label;
        document.getElementById("ui-top-date").innerText = todayScoreObj.dateTxt;

        document.getElementById("results").style.display = "none";
        document.getElementById("app-wrapper").style.display = "block";

    } catch(e) {
        console.error(e);
        document.getElementById("results").innerText = "Engine Error. Please try again.";
    }
}
</script>

</body>
</html>
