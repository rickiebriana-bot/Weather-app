<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Reality Pro</title>

<style>
:root {
    --bg-base: #09101d;
    --bg-panel: #111a2c;
    --bg-panel-hover: #162138;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-dark: #64748b;
    --accent: #38bdf8;
    --bar-bg: #1e293b;
    
    --green: #22c55e;
    --green-light: #4ade80;
    --green-bg: rgba(34, 197, 94, 0.15);
    
    --yellow: #eab308;
    --yellow-light: #fde047;
    --yellow-bg: rgba(234, 179, 8, 0.15);
    
    --orange: #f97316;
    --orange-light: #fdba74;
    --orange-bg: rgba(249, 115, 22, 0.15);
    
    --red: #ef4444;
    --red-light: #fca5a5;
    --red-bg: rgba(239, 68, 68, 0.15);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
}

/* Search Area */
.search-container {
    max-width: 800px;
    margin: 0 auto 30px auto;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

input {
    flex-grow: 1;
    min-width: 200px;
    background: var(--bg-panel);
    border: 1px solid var(--bar-bg);
    padding: 14px 18px;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus { border-color: var(--accent); }

button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
}

button:hover { background: #7dd3fc; }

.fav-btn {
    background: var(--bg-panel);
    color: var(--text-muted);
    border: 1px solid var(--bar-bg);
}

.fav-btn:hover { background: var(--bg-panel-hover); color: white; }

/* Main App Wrapper */
#app-wrapper {
    max-width: 800px;
    margin: 0 auto;
    display: none;
}

/* Top Dashboard (Current) */
.current-dash {
    background: transparent;
    padding: 10px 0 40px 0;
}

.loc-name {
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 5px;
    font-weight: 600;
}

.flex-between {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.temp-huge {
    font-size: 96px;
    font-weight: 200;
    line-height: 1;
    margin: 0;
}

.desc-text {
    font-size: 18px;
    color: var(--text-muted);
    margin-top: 10px;
}

/* Top Gauge */
.gauge-box {
    text-align: right;
    padding-bottom: 10px;
}
.gauge-label {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dark);
    text-transform: uppercase;
    margin-bottom: 2px;
    font-weight: 600;
}
.gauge-val {
    font-size: 26px;
    font-weight: 600;
}
.gauge-date {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
}

/* Metrics Row */
.metrics-row {
    display: flex;
    gap: 20px;
    margin-top: 25px;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
    flex-wrap: wrap;
}
.metrics-row span {
    display: flex;
    align-items: center;
    gap: 6px;
}

/* 10-Day Forecast List */
.forecast-section {
    margin-top: 20px;
}
.section-title {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: var(--text-dark);
    font-weight: 600;
    margin-bottom: 15px;
}

.f-row {
    display: grid;
    grid-template-columns: 80px 40px 1fr 40px 120px 40px 50px 90px;
    align-items: center;
    background: var(--bg-panel);
    margin-bottom: 8px;
    padding: 16px 20px;
    border-radius: 16px;
    transition: transform 0.2s, background 0.2s;
}

.f-row:hover {
    background: var(--bg-panel-hover);
    transform: scale(1.01);
}

.f-date {
    font-size: 15px;
    font-weight: 500;
}
.f-date span {
    display: block;
    font-size: 12px;
    color: var(--text-dark);
    margin-top: 2px;
}

.f-icon { font-size: 20px; text-align: center; }
.f-desc { font-size: 14px; color: var(--text-muted); padding-left: 10px; }
.f-temp { font-size: 15px; font-weight: 500; text-align: center; }
.f-temp.muted { color: var(--text-muted); }

/* Dynamic Temp Bar */
.bar-wrapper {
    height: 4px;
    background: var(--bar-bg);
    border-radius: 2px;
    margin: 0 10px;
    position: relative;
    overflow: hidden;
}
.bar-fill {
    position: absolute;
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #3b82f6, #f97316);
}

.f-precip {
    font-size: 13px;
    color: var(--accent);
    text-align: right;
    padding-right: 15px;
}

/* Score Pills */
.score-pill {
    padding: 6px 0;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    border: 1px solid transparent;
}
.pill-green { border-color: var(--green); color: var(--green-light); background: var(--green-bg); }
.pill-yellow { border-color: var(--yellow); color: var(--yellow-light); background: var(--yellow-bg); }
.pill-orange { border-color: var(--orange); color: var(--orange-light); background: var(--orange-bg); }
.pill-red { border-color: var(--red); color: var(--red-light); background: var(--red-bg); }

/* Mobile fallback */
@media (max-width: 650px) {
    .f-row { grid-template-columns: 70px 30px 1fr 80px; }
    .f-temp, .bar-wrapper, .f-precip { display: none; }
    .temp-huge { font-size: 72px; }
}
</style>
</head>

<body>

<div class="search-container">
    <input id="location" placeholder="Search city (e.g. San Francisco, CA)">
    <button onclick="run()">Search</button>
    <button class="fav-btn" onclick="searchFavorite('Revere, MA')">📍 Revere, MA</button>
</div>

<div id="results" style="text-align:center; color: #64748b; margin-top: 40px;">Enter a location to view the 10-Day Reality Forecast.</div>

<div id="app-wrapper">
    <div class="current-dash">
        <div class="loc-name" id="ui-loc">--</div>
        
        <div class="flex-between">
            <h1 class="temp-huge" id="ui-temp">--°</h1>
            
            <div class="gauge-box">
                <div class="gauge-label">Outdoor Score</div>
                <div class="gauge-val" id="ui-top-score">--</div>
                <div class="gauge-date" id="ui-top-date">--</div>
            </div>
        </div>
        
        <div class="desc-text" id="ui-desc">--</div>
        
        <div class="metrics-row">
            <span id="ui-wind">💨 --</span>
            <span id="ui-hum">💧 --</span>
            <span id="ui-rain">☔ --</span>
            <span id="ui-uv">☀️ --</span>
            <span id="ui-hilo">⬆ -- / ⬇ --</span>
        </div>
    </div>
    
    <div class="forecast-section">
        <div class="section-title">10-DAY FORECAST</div>
        <div id="forecast-list"></div>
    </div>
</div>

<script>
document.getElementById("location").addEventListener("keypress", function(event) {
    if (event.key === "Enter") run();
});

function searchFavorite(loc) {
    document.getElementById("location").value = loc;
    run();
}

// Map WMO codes to clean UI text/icons
const wmoMap = {
    0: { txt: "Sunny", icon: "☀️" }, 1: { txt: "Mainly Sunny", icon: "🌤" },
    2: { txt: "Partly Cloudy", icon: "⛅" }, 3: { txt: "Cloudy", icon: "☁️" },
    45: { txt: "Foggy", icon: "🌫" }, 48: { txt: "Rime Fog", icon: "🌫" },
    51: { txt: "Light Drizzle", icon: "🌧" }, 53: { txt: "Drizzle", icon: "🌧" },
    55: { txt: "Heavy Drizzle", icon: "🌧" }, 61: { txt: "Light Rain", icon: "🌦" },
    63: { txt: "Rain", icon: "🌧" }, 65: { txt: "Heavy Rain", icon: "🌧" },
    71: { txt: "Light Snow", icon: "🌨" }, 73: { txt: "Snow", icon: "❄️" },
    75: { txt: "Heavy Snow", icon: "❄️" }, 95: { txt: "Thunderstorms", icon: "⛈" }
};
function getWeatherMeta(code) { return wmoMap[code] || { txt: "Mixed", icon: "🌥" }; }

// THE PERCEPTION ENGINE PIPELINE
const Pipeline = {
    // Stage 1: Convert raw API data to human perception (0-100)
    perceiveThermal: (feelsLike) => {
        const diff = Math.abs(feelsLike - 75); // 75F is ideal
        return Math.max(0, 100 - (diff * 2.5));
    },
    perceiveMoisture: (precipProb) => {
        return Math.max(0, 100 - (precipProb * 1.5)); // Heavy penalty for rain chance
    },
    perceiveWind: (windMph) => {
        return windMph < 5 ? 100 : Math.max(0, 100 - ((windMph - 5) * 3));
    },
    perceiveSky: (clouds) => {
        return Math.max(0, 100 - (clouds * 0.3)); // Light penalty for gloom
    },
    
    // Stage 2 & 3: Dimension Combining -> Base Comfort Score
    getBaseComfort: function(hourData) {
        const t = this.perceiveThermal(hourData.apparentTemp);
        const m = this.perceiveMoisture(hourData.precip);
        const w = this.perceiveWind(hourData.wind);
        const s = this.perceiveSky(hourData.clouds);
        
        // Weighting matrix
        return (t * 0.45) + (m * 0.35) + (w * 0.10) + (s * 0.10);
    },
    
    // Stage 4 & 5: Contextual Overrides -> Final Rating
    applyContext: function(baseScore, hourData, month) {
        let final = baseScore;
        
        // Seasonal Context Generation
        let profile = {};
        if (month >= 5 && month <= 7) profile = { minTemp: 62, maxTemp: 94, maxRain: 30, maxWind: 22 };
        else if (month >= 8 && month <= 10) profile = { minTemp: 45, maxTemp: 76, maxRain: 15, maxWind: 20 };
        else if (month === 11 || month <= 1) profile = { minTemp: 28, maxTemp: 58, maxRain: 10, maxWind: 18 };
        else profile = { minTemp: 50, maxTemp: 80, maxRain: 25, maxWind: 22 };

        // Hard Dealbreakers
        if (hourData.precip > profile.maxRain) return 0;
        if (hourData.wind > profile.maxWind) return 0;
        if (hourData.apparentTemp < profile.minTemp || hourData.apparentTemp > profile.maxTemp) return 0;
        
        return Math.max(0, Math.min(100, final));
    }
};

// UI Color mapping
function getScoreStyling(score) {
    if(score >= 80) return { label: "Excellent", cls: "pill-green", color: "var(--green-light)" };
    if(score >= 60) return { label: "Good", cls: "pill-yellow", color: "var(--yellow-light)" };
    if(score >= 40) return { label: "Fair", cls: "pill-orange", color: "var(--orange-light)" };
    return { label: "Poor", cls: "pill-red", color: "var(--red-light)" };
}

async function run() {
    const loc = document.getElementById("location").value.trim();
    if(!loc) return;

    document.getElementById("results").style.display = "block";
    document.getElementById("results").innerText = "Analyzing pipeline...";
    document.getElementById("app-wrapper").style.display = "none";

    try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(loc)}&count=1`);
        const geoData = await geoRes.json();
        if(!geoData.results) {
            document.getElementById("results").innerText = "Location not found.";
            return;
        }
        
        const { latitude, longitude, name, admin1 } = geoData.results[0];

        // Fetch 10-day data (Current + Hourly + Daily)
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,precipitation&hourly=precipitation_probability,temperature_2m,apparent_temperature,wind_speed_10m,cloud_cover&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&forecast_days=10&timezone=auto&temperature_unit=fahrenheit&wind_speed_unit=mph`;
        
        const weatherRes = await fetch(weatherUrl);
        const data = await weatherRes.json();

        // 1. Build Top UI (Current Conditions)
        const cur = data.current;
        const todayDaily = {
            hi: data.daily.temperature_2m_max[0],
            lo: data.daily.temperature_2m_min[0],
            uv: data.daily.uv_index_max[0] || 0
        };
        const curMeta = getWeatherMeta(cur.weather_code);

        document.getElementById("ui-loc").innerText = `${name}, ${admin1 || ""}`;
        document.getElementById("ui-temp").innerText = `${Math.round(cur.temperature_2m)}°`;
        document.getElementById("ui-desc").innerText = `${curMeta.txt} · Feels like ${Math.round(cur.apparent_temperature)}°`;
        document.getElementById("ui-wind").innerText = `💨 ${Math.round(cur.wind_speed_10m)} mph`;
        document.getElementById("ui-hum").innerText = `💧 ${Math.round(cur.relative_humidity_2m)}% humidity`;
        document.getElementById("ui-rain").innerText = `☔ ${cur.precipitation > 0 ? '>0' : '0'}% precip`;
        document.getElementById("ui-uv").innerText = `☀️ UV ${Math.round(todayDaily.uv)}`;
        document.getElementById("ui-hilo").innerText = `⬆ ${Math.round(todayDaily.hi)}° / ⬇ ${Math.round(todayDaily.lo)}°`;

        // 2. Process Hourly Data for 10-Day Scoring
        const times = data.hourly.time;
        const days = {};
        times.forEach((t, i) => {
            const date = t.split("T")[0];
            const hour = parseInt(t.split("T")[1].slice(0,2));
            if(!days[date]) days[date] = [];
            
            days[date].push({
                hour,
                precip: data.hourly.precipitation_probability[i] || 0,
                actualTemp: data.hourly.temperature_2m[i],
                apparentTemp: data.hourly.apparent_temperature[i],
                wind: data.hourly.wind_speed_10m[i],
                clouds: data.hourly.cloud_cover[i]
            });
        });

        // Absolutes for the temperature bar rendering
        const absMin = Math.min(...data.daily.temperature_2m_min);
        const absMax = Math.max(...data.daily.temperature_2m_max);

        // 3. Process Daily Rows
        let listHTML = "";
        let todayScoreObj = null;

        const dayKeys = Object.keys(days).slice(0, 10);
        
        dayKeys.forEach((dateStr, idx) => {
            const entries = days[dateStr];
            const daytime = entries.filter(e => e.hour >= 7 && e.hour <= 19);
            const month = new Date(dateStr + "T12:00:00").getMonth();

            // Run the "Best 4 Hours" pipeline for the day
            let dailyBestScore = -1;
            for(let i = 0; i <= daytime.length - 4; i++) {
                const windowHours = daytime.slice(i, i + 4);
                let windowTotal = 0;
                
                windowHours.forEach(h => {
                    const base = Pipeline.getBaseComfort(h);
                    const final = Pipeline.applyContext(base, h, month);
                    windowTotal += final;
                });
                
                const avgScore = windowTotal / 4;
                if(avgScore > dailyBestScore) dailyBestScore = avgScore;
            }
            if(dailyBestScore < 0) dailyBestScore = 0; // Fallback

            // Daily UI Variables
            const dayMin = data.daily.temperature_2m_min[idx];
            const dayMax = data.daily.temperature_2m_max[idx];
            const maxPrecip = data.daily.precipitation_probability_max[idx];
            const meta = getWeatherMeta(data.daily.weather_code[idx]);
            const scoreStyle = getScoreStyling(dailyBestScore);
            
            // Bar Calculation
            const leftPct = ((dayMin - absMin) / (absMax - absMin)) * 100;
            const widthPct = ((dayMax - dayMin) / (absMax - absMin)) * 100;

            // Date Formatting
            const dObj = new Date(dateStr + "T12:00:00");
            const dayName = idx === 0 ? "Today" : dObj.toLocaleDateString("en-US", { weekday: "short" });
            const monthDay = dObj.toLocaleDateString("en-US", { month: "short", day: "numeric" });

            if(idx === 0) todayScoreObj = { score: Math.round(dailyBestScore), style: scoreStyle, dateTxt: monthDay };

            listHTML += `
            <div class="f-row">
                <div class="f-date"><b>${dayName}</b><span>${monthDay}</span></div>
                <div class="f-icon">${meta.icon}</div>
                <div class="f-desc">${meta.txt}</div>
                <div class="f-temp muted">${Math.round(dayMin)}°</div>
                <div class="bar-wrapper">
                    <div class="bar-fill" style="margin-left: ${leftPct}%; width: ${widthPct}%;"></div>
                </div>
                <div class="f-temp">${Math.round(dayMax)}°</div>
                <div class="f-precip">${maxPrecip > 0 ? maxPrecip + '%' : '-'}</div>
                <div class="score-pill ${scoreStyle.cls}">outdoor ${Math.round(dailyBestScore)}</div>
            </div>
            `;
        });

        // 4. Final Render
        document.getElementById("forecast-list").innerHTML = listHTML;
        
        // Update top gauge with today's pipeline score
        document.getElementById("ui-top-score").innerText = todayScoreObj.score;
        document.getElementById("ui-top-score").style.color = todayScoreObj.style.color;
        document.getElementById("ui-top-score").nextElementSibling.innerText = todayScoreObj.style.label;
        document.getElementById("ui-top-date").innerText = todayScoreObj.dateTxt;

        document.getElementById("results").style.display = "none";
        document.getElementById("app-wrapper").style.display = "block";

    } catch(e) {
        console.error(e);
        document.getElementById("results").innerText = "Data pipeline error. Please try again.";
    }
}
</script>

</body>
</html>
