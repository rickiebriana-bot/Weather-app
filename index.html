<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Reality</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

.search {
    text-align: center;
    margin-bottom: 20px;
}

input {
    padding: 12px;
    width: 260px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #007aff;
    color: white;
    margin-left: 6px;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background: #005bb5;
}

#results {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
    margin-top: 20px;
    transition: opacity 0.3s;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.best {
    border: 3px solid #22c55e;
}

.icon {
    font-size: 42px;
    margin-bottom: 10px;
}

.score {
    font-size: 24px;
    font-weight: bold;
    margin-top: 6px;
    color: #111;
}

.locationInfo {
    grid-column: 1 / -1; 
    text-align: center;
    color: #666;
    font-size: 16px;
    margin-bottom: 10px;
}

.activity-list {
    width: 100%;
    margin-top: 15px;
    border-top: 1px solid #eee;
    padding-top: 10px;
}

.activity-item {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
    color: #444;
}

.activity-item strong {
    color: #111;
}

/* Debug Dropdown Styles */
.detailsBtn {
    margin-top: 15px;
    padding: 8px 10px;
    border: none;
    border-radius: 8px;
    background: #eee;
    color: #333;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
    transition: background 0.2s;
}

.detailsBtn:hover {
    background: #e5e7eb;
}

.details {
    display: none;
    margin-top: 10px;
    padding: 12px;
    background: #f9fafb;
    border-radius: 10px;
    font-size: 13px;
    color: #444;
    text-align: left;
    width: 100%;
    box-sizing: border-box;
}

.details div {
    margin-bottom: 4px;
}
</style>
</head>

<body>

<h1>☀️ Weather Reality</h1>

<div class="search">
    <input id="location" placeholder="City, State (e.g. Revere, MA)">
    <button onclick="run()">Check</button>
</div>

<div id="results"></div>

<script>
document.getElementById("location").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        run();
    }
});

function toggleDetails(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
}

// 1. Static Activities (Time-boxed)
const activities = [
    {
        name: "Skiing",
        months: [11, 0, 1, 2, 3], // Dec, Jan, Feb, Mar, Apr
        startHour: 9,  // 9 AM
        endHour: 15,   // 3 PM
        minTemp: -10,
        maxTemp: 38,
        idealTemp: 25,
        tempFlexibility: 10,
        maxRainProb: 0,
        maxWind: 25,
        needsSun: false
    },
    {
        name: "Beach Day",
        months: [4, 5, 6, 7, 8], // May, Jun, Jul, Aug, Sep
        startHour: 11, // 11 AM
        endHour: 15,   // 3 PM (Peak heat/sun)
        minTemp: 72,
        maxTemp: 105,
        idealTemp: 85,
        tempFlexibility: 8,
        maxRainProb: 10,
        maxWind: 15,         
        needsSun: true
    }
];

// 2. Dynamic Season Generator (Rules only, time is handled dynamically now)
function getGeneralOutdoorsProfile(dateString) {
    const month = new Date(dateString + "T12:00:00").getMonth();

    if (month >= 5 && month <= 7) { // June, July, Aug
        return { name: "General Outdoors", idealTemp: 76, tempFlexibility: 10, minTemp: 62, maxTemp: 94, maxRainProb: 30, maxWind: 22, needsSun: false };
    } else if (month >= 8 && month <= 10) { // Sept, Oct, Nov
        return { name: "General Outdoors", idealTemp: 62, tempFlexibility: 10, minTemp: 45, maxTemp: 76, maxRainProb: 15, maxWind: 20, needsSun: false };
    } else if (month === 11 || month === 0 || month === 1) { // Dec, Jan, Feb
        return { name: "General Outdoors", idealTemp: 42, tempFlexibility: 12, minTemp: 28, maxTemp: 58, maxRainProb: 10, maxWind: 18, needsSun: false };
    } else { // Mar, Apr, May
        return { name: "General Outdoors", idealTemp: 65, tempFlexibility: 10, minTemp: 50, maxTemp: 80, maxRainProb: 25, maxWind: 22, needsSun: false };
    }
}

function getIcon(score) {
    if(score >= 90) return "☀️";
    if(score >= 80) return "⛅";
    if(score >= 70) return "🌤";
    if(score >= 60) return "🌥";
    return "🌧";
}

function getLabel(score) {
    if(score >= 90) return "Prime Conditions";
    if(score >= 80) return "Great Day";
    if(score >= 70) return "Decent";
    if(score >= 60) return "Mixed";
    return "Stay Inside";
}

// 3. Updated Universal Scoring Engine
function calculateHourlyActivityScore(hourlyData, activity) {
    if (activity.minTemp !== undefined && hourlyData.apparentTemp < activity.minTemp) return 0;
    if (activity.maxTemp !== undefined && hourlyData.apparentTemp > activity.maxTemp) return 0;
    if (hourlyData.precip > activity.maxRainProb) return 0;
    if (hourlyData.wind > activity.maxWind) return 0;

    let score = 100;
    const tempDiff = Math.abs(hourlyData.apparentTemp - activity.idealTemp);
    if (tempDiff > activity.tempFlexibility) {
        score -= (tempDiff - activity.tempFlexibility) * 3;
    }

    if (activity.needsSun) {
        score -= (hourlyData.clouds / 2);
    }

    return Math.max(0, score); 
}

// Helper to format 24h to 12h time
function formatHour(h) {
    if (h === 0) return "12 AM";
    if (h === 12) return "12 PM";
    if (h > 12) return (h - 12) + " PM";
    return h + " AM";
}

async function run() {
    const locationInput = document.getElementById("location").value.trim();
    const resultsContainer = document.getElementById("results");

    if(!locationInput) {
        alert("Enter a location");
        return;
    }

    resultsContainer.style.opacity = "0.5";
    resultsContainer.innerHTML = "<div class='locationInfo'>Loading forecast...</div>";

    const cityQuery = locationInput.split(',')[0];

    try {
        const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityQuery)}&count=1`);
        const geoData = await geo.json();

        if(!geoData.results) {
            resultsContainer.innerHTML = "<div class='locationInfo'>Location not found</div>";
            resultsContainer.style.opacity = "1";
            return;
        }

        const { latitude, longitude, name, admin1 } = geoData.results[0];

        // Fetch API includes temperature_2m for actual temp stats
        const weather = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=precipitation_probability,temperature_2m,apparent_temperature,wind_speed_10m,cloud_cover&forecast_days=7&timezone=auto&temperature_unit=fahrenheit&wind_speed_unit=mph`
        );
        const data = await weather.json();

        const times = data.hourly.time;
        const precip = data.hourly.precipitation_probability;
        const actualTemp = data.hourly.temperature_2m;
        const apparentTemp = data.hourly.apparent_temperature;
        const wind = data.hourly.wind_speed_10m;
        const clouds = data.hourly.cloud_cover;

        const days = {};

        times.forEach((t, i) => {
            const date = t.split("T")[0];
            const hour = parseInt(t.split("T")[1].slice(0,2));

            if(!days[date]) days[date] = [];

            days[date].push({
                hour,
                precip: precip[i] || 0,
                actualTemp: actualTemp[i] || 70,
                apparentTemp: apparentTemp[i] || 70,
                wind: wind[i] || 0,
                clouds: clouds[i] || 0
            });
        });

        const dayKeys = Object.keys(days).slice(0,7);
        let resultsHTML = `
            <div class="locationInfo">
                <h2>${name}, ${admin1 || ""}</h2>
                <p>7-day "Usable Weather" forecast based on Feels-Like conditions</p>
            </div>
        `;

        let bestIndex = 0;
        let overallBestGeneralScore = -Infinity;
        const processedDays = [];

        dayKeys.forEach((date, idx) => {
            const entries = days[date];
            // Look at standard daytime hours for the general scan
            const daytime = entries.filter(e => e.hour >= 7 && e.hour <= 19);
            
            const generalOutdoors = getGeneralOutdoorsProfile(date);
            
            // --- THE "BEST 4 HOURS" METHOD ---
            let dailyBestGeneralScore = -1;
            let bestWindowStats = null;
            let bestWindowLabel = "";

            // Scan through the day in 4-hour chunks
            for(let i = 0; i <= daytime.length - 4; i++) {
                const windowHours = daytime.slice(i, i + 4);
                let windowScore = 0;
                let wAvgActual = 0, wAvgFeels = 0, wMaxRain = 0, wMaxWind = 0, wAvgClouds = 0;

                windowHours.forEach(h => {
                    windowScore += calculateHourlyActivityScore(h, generalOutdoors);
                    wAvgActual += h.actualTemp;
                    wAvgFeels += h.apparentTemp;
                    wMaxRain = Math.max(wMaxRain, h.precip);
                    wMaxWind = Math.max(wMaxWind, h.wind);
                    wAvgClouds += h.clouds;
                });

                const avgScore = windowScore / 4;

                // If this 4-hour chunk is better than the previous ones, save it!
                if(avgScore > dailyBestGeneralScore) {
                    dailyBestGeneralScore = avgScore;
                    bestWindowStats = {
                        avgActual: wAvgActual / 4,
                        avgFeels: wAvgFeels / 4,
                        maxRain: wMaxRain, 
                        maxWind: wMaxWind,
                        avgClouds: wAvgClouds / 4
                    };
                    const startH = windowHours[0].hour;
                    const endH = windowHours[3].hour;
                    bestWindowLabel = `${formatHour(startH)} - ${formatHour(endH + 1)}`;
                }
            }

            // Fallback just in case
            if (!bestWindowStats) bestWindowStats = {avgActual:0, avgFeels:0, maxRain:0, maxWind:0, avgClouds:0};

            // Calculate Specific Activities using their exact configured hours
            const dailyActivityScores = {};
            activities.forEach(activity => {
                let totalScore = 0;
                const activeHours = entries.filter(e => e.hour >= activity.startHour && e.hour <= activity.endHour);
                
                activeHours.forEach(hour => {
                    totalScore += calculateHourlyActivityScore(hour, activity);
                });
                
                dailyActivityScores[activity.name] = totalScore / (activeHours.length || 1);
            });

            // Keep track of the absolute best day of the week
            if(dailyBestGeneralScore > overallBestGeneralScore) {
                overallBestGeneralScore = dailyBestGeneralScore;
                bestIndex = idx;
            }

            processedDays.push({ 
                date, 
                generalScore: dailyBestGeneralScore, 
                bestWindowLabel,
                dailyActivityScores, 
                stats: bestWindowStats 
            });
        });

        processedDays.forEach((d, i) => {
            const icon = getIcon(d.generalScore);
            const label = getLabel(d.generalScore);
            
            const dateObj = new Date(d.date + "T12:00:00");
            const labelDate = i === 0 ? "Today" : 
                              i === 1 ? "Tomorrow" : 
                              dateObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
            
            const detailId = "detail_" + i;
            let activitiesHTML = "";

            activities.forEach(act => {
                const month = dateObj.getMonth();

                if (act.months && !act.months.includes(month)) {
                    return;
                }

                const score = d.dailyActivityScores[act.name].toFixed(0);
                const color = score < 50 ? "#ef4444" : score > 80 ? "#22c55e" : "#444";
                
                activitiesHTML += `
                    <div class="activity-item">
                        <span>${act.name}</span>
                        <strong style="color: ${color}">${score}/100</strong>
                    </div>
                `;
            });
            
            resultsHTML += `
            <div class="card ${i === bestIndex ? "best" : ""}">
                <h3>${labelDate}</h3>
                <div class="icon">${icon}</div>
                <strong>${label}</strong>
                
                <div class="score">
                    ${d.generalScore.toFixed(0)} <span style="font-size:14px; color:#666;">/ 100</span>
                </div>

                <div class="activity-list">
                    ${activitiesHTML}
                </div>

                <button class="detailsBtn" onclick="toggleDetails('${detailId}')">
                    Why this score?
                </button>

                <div class="details" id="${detailId}">
                    <div style="color:#007aff; margin-bottom:8px;"><b>Best Window:</b> ${d.bestWindowLabel}</div>
                    <div><b>Avg Actual Temp:</b> ${d.stats.avgActual.toFixed(1)}°F</div>
                    <div><b>Avg Feels Like:</b> ${d.stats.avgFeels.toFixed(1)}°F</div>
                    <div><b>Max Rain Chance:</b> ${d.stats.maxRain}%</div>
                    <div><b>Max Wind:</b> ${d.stats.maxWind.toFixed(1)} mph</div>
                    <div><b>Avg Cloud Cover:</b> ${d.stats.avgClouds.toFixed(0)}%</div>
                </div>
            </div>
            `;
        });

        resultsContainer.innerHTML = resultsHTML;
        resultsContainer.style.opacity = "1";

    } catch(e) {
        console.log(e);
        resultsContainer.innerHTML = "<div class='locationInfo'>Error loading weather data. Please try again.</div>";
        resultsContainer.style.opacity = "1";
    }
}
</script>

</body>
</html>
